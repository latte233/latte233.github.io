<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 全域雷达图 · 2026-07-07</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
h1 { margin: 20px 0 5px; font-size: 1.5em; color: #e94560; }
.subtitle { color: #888; margin-bottom: 20px; font-size: 0.9em; }
.radar-container { position: relative; width: 800px; height: 800px; max-width: 90vw; max-height: 90vw; }
svg { width: 100%; height: 100%; }
.quadrant-label { font-size: 14px; font-weight: bold; text-anchor: middle; }
.ring-label { font-size: 12px; fill: #666; text-anchor: middle; }
.blip { cursor: pointer; transition: all 0.3s; }
.blip:hover { transform: scale(1.5); }
.blip-adopt { fill: #00b894; }
.blip-trial { fill: #0984e3; }
.blip-assess { fill: #fdcb6e; }
.blip-watch { fill: #e17055; }
.blip-new { stroke: #fff; stroke-width: 2; }
.tooltip { position: absolute; background: rgba(0,0,0,0.9); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; display: none; max-width: 250px; border: 1px solid #e94560; }
.legend { display: flex; gap: 20px; margin: 15px 0; flex-wrap: wrap; justify-content: center; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.85em; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }
</style>
</head>
<body>
<h1>AI 全域雷达图 · 2026-07-07</h1>
<p class="subtitle">全量扫描 · 16 信号源 · 13 条信号 · Adopt 3 / Trial 5 / Assess 4 / Watch 2</p>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#00b894"></div>Adopt</div>
<div class="legend-item"><div class="legend-dot" style="background:#0984e3"></div>Trial</div>
<div class="legend-item"><div class="legend-dot" style="background:#fdcb6e"></div>Assess</div>
<div class="legend-item"><div class="legend-dot" style="background:#e17055"></div>Watch</div>
<div class="legend-item"><div class="legend-dot" style="background:#fff;border:2px solid #e94560"></div>🆕 新信号</div>
</div>
<div class="radar-container">
<svg viewBox="0 0 800 800" id="radar">
<!-- Quadrant backgrounds -->
<rect x="0" y="0" width="400" height="400" fill="#2d2d44" opacity="0.3"/>
<rect x="400" y="0" width="400" height="400" fill="#2d2d55" opacity="0.3"/>
<rect x="0" y="400" width="400" height="400" fill="#2d2d66" opacity="0.3"/>
<rect x="400" y="400" width="400" height="400" fill="#2d2d77" opacity="0.3"/>
<!-- Rings (concentric circles) -->
<circle cx="400" cy="400" r="350" fill="none" stroke="#444" stroke-width="1"/>
<circle cx="400" cy="400" r="260" fill="none" stroke="#444" stroke-width="1"/>
<circle cx="400" cy="400" r="170" fill="none" stroke="#444" stroke-width="1"/>
<circle cx="400" cy="400" r="80" fill="none" stroke="#444" stroke-width="1"/>
<!-- Axes -->
<line x1="400" y1="50" x2="400" y2="750" stroke="#555" stroke-width="1"/>
<line x1="50" y1="400" x2="750" y2="400" stroke="#555" stroke-width="1"/>
<!-- Ring labels -->
<text x="400" y="325" class="ring-label">Adopt</text>
<text x="400" y="240" class="ring-label">Trial</text>
<text x="400" y="155" class="ring-label">Assess</text>
<text x="400" y="75" class="ring-label">Watch</text>
<!-- Quadrant labels -->
<text x="200" y="30" class="quadrant-label" fill="#e94560">模型</text>
<text x="600" y="30" class="quadrant-label" fill="#e94560">工具</text>
<text x="200" y="780" class="quadrant-label" fill="#e94560">平台</text>
<text x="600" y="780" class="quadrant-label" fill="#e94560">标准/安全/行业</text>
<!-- Blips: Q1=模型(top-left), Q2=工具(top-right), Q3=平台(bottom-left), Q4=标准/安全/行业(bottom-right) -->
<!-- Q1: 模型 (top-left quadrant, cx=200, cy=200) -->
<!-- 天工 Matrix-Game 3.5 - Watch -->
<circle cx="180" cy="80" r="6" class="blip blip-watch blip-new" data-name="天工 Matrix-Game 3.5" data-desc="世界模型，状态-动作联合生成，7月发布" data-ring="Watch" data-new="true"/>

<!-- Q2: 工具 (top-right quadrant, cx=600, cy=200) -->
<!-- MCP 2026-07-28 规范 - Adopt -->
<circle cx="560" cy="350" r="6" class="blip blip-adopt" data-name="MCP 2026-07-28 规范" data-desc="协议史上最大重构，无状态核心+Extensions框架" data-ring="Adopt" data-new="false"/>
<!-- anthropics/skills - Adopt -->
<circle cx="640" cy="360" r="6" class="blip blip-adopt" data-name="anthropics/skills" data-desc="158K Star，Agent Skills事实标准" data-ring="Adopt" data-new="false"/>
<!-- Ruflo - Adopt -->
<circle cx="600" cy="330" r="6" class="blip blip-adopt" data-name="Ruflo（原Claude Flow）" data-desc="63K Star，多Agent编排框架，半年翻倍增长" data-ring="Adopt" data-new="false"/>
<!-- CodeGraph - Trial -->
<circle cx="540" cy="260" r="6" class="blip blip-trial blip-new" data-name="CodeGraph" data-desc="本周黑马58K Star，本地代码知识图谱" data-ring="Trial" data-new="true"/>
<!-- Microsoft Agent Framework - Trial -->
<circle cx="640" cy="240" r="6" class="blip blip-trial" data-name="Microsoft Agent Framework" data-desc="12K Star，跨.NET/Python生产级框架" data-ring="Trial" data-new="false"/>
<!-- Microsoft Conductor - Assess -->
<circle cx="570" cy="150" r="6" class="blip blip-assess blip-new" data-name="Microsoft Conductor" data-desc="确定性多Agent编排引擎" data-ring="Assess" data-new="true"/>

<!-- Q3: 平台 (bottom-left quadrant, cx=200, cy=600) -->
<!-- Claude Science - Trial -->
<circle cx="180" cy="530" r="6" class="blip blip-trial" data-name="Claude Science" data-desc="科研工作台公测，启动自研药物发现" data-ring="Trial" data-new="false"/>
<!-- FinceptTerminal - Trial -->
<circle cx="250" cy="540" r="6" class="blip blip-trial" data-name="FinceptTerminal" data-desc="28K Star，开源彭博终端平替" data-ring="Trial" data-new="false"/>

<!-- Q4: 标准/安全/行业 (bottom-right quadrant, cx=600, cy=600) -->
<!-- Context Engineering - Trial -->
<circle cx="540" cy="520" r="6" class="blip blip-trial" data-name="Context Engineering / Agent 记忆" data-desc="Agent记忆系统从可选到标配" data-ring="Trial" data-new="false"/>
<!-- SWE-bench争议 - Assess -->
<circle cx="620" cy="150" r="6" class="blip blip-assess blip-new" data-name="SWE-bench 刷分争议" data-desc="19.78%假阳性，Terminal-Bench 2.1崛起" data-ring="Assess" data-new="true"/>
<!-- 提示注入CVE - Assess -->
<circle cx="680" cy="160" r="6" class="blip blip-assess" data-name="提示注入 CVE 化" data-desc="CVE-2026-24299影响Copilot" data-ring="Assess" data-new="false"/>
<!-- 中国大模型IPO竞速 - Watch -->
<circle cx="600" cy="690" r="6" class="blip blip-watch" data-name="中国大模型三强IPO竞速" data-desc="智谱/MiniMax/月之暗面角逐第一股" data-ring="Watch" data-new="false"/>
</svg>
<div class="tooltip" id="tooltip"></div>
</div>
<script>
const blips = document.querySelectorAll('.blip');
const tooltip = document.getElementById('tooltip');
const container = document.querySelector('.radar-container');
blips.forEach(blip => {
blip.addEventListener('mouseenter', (e) => {
const name = blip.getAttribute('data-name');
const desc = blip.getAttribute('data-desc');
const ring = blip.getAttribute('data-ring');
const isNew = blip.getAttribute('data-new') === 'true';
tooltip.innerHTML = `<strong>${name}</strong><br/>环位: ${ring}${isNew ? ' 🆕' : ''}<br/>${desc}`;
tooltip.style.display = 'block';
});
blip.addEventListener('mousemove', (e) => {
const rect = container.getBoundingClientRect();
tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
tooltip.style.top = (e.clientY - rect.top + 15) + 'px';
});
blip.addEventListener('mouseleave', () => {
tooltip.style.display = 'none';
});
});
</script>
</body>
</html>
