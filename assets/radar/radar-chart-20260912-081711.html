signals.forEach((s,i)=>{const a=(start[s.q]+((i*29)%span[s.q]))*Math.PI/180;const [min,max]=ranges[s.r];const rad=min+((i*13)%(max-min));const x=50+Math.cos(a)*rad/2,y=50+Math.sin(a)*rad/2;const dot=document.createElement('button');dot.className='dot '+s.r.toLowerCase();dot.style.left=x+'%';dot.style.top=y+'%';dot.setAttribute('aria-label',s.n);dot.addEventListener('mouseenter',e=>{tip.innerHTML='<b>'+s.n+'</b><span>'+s.d+'</span>';tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'});dot.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'});dot.addEventListener('mouseleave',()=>tip.style.display='none');dot.addEventListener('click',()=>window.open(s.u,'_blank','noopener'));radar.appendChild(dot);const el=document.createElement('div');el.className='item '+s.r.toLowerCase();el.innerHTML='<a href="'+s.u+'" target="_blank" rel="noopener">'+s.n+'</a><span class="pill">'+s.r+'</span><p>'+s.d+'</p>';items.appendChild(el)});
</script></body></html>
