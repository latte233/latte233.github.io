 "https://research.meta.ai/blog/introducing-muse-code-and-muse-spark-1-2", "ringChange": "Trial → Assess"}, {"name": "human-writing", "ring": "Assess", "quadrant": "Tools & Products", "isNew": false, "description": "让 AI 写的中文更像真人的通用创作 Skill，Star 从 1025 增长到 1561（7 天 +536），持续走高，仍为单人维护。", "url": "https://github.com/KKKKhazix/human-writing", "ringChange": "Watch → Assess"}, {"name": "Kimi K3", "ring": "Assess", "quadrant": "Models & Research", "isNew": false, "description": "Moonshot 2.78T 模型仓库，Star 8146；连续两期 0 commit 后本期恢复至 4 次 commit，解除衰减预警，升级观察。", "url": "https://github.com/MoonshotAI/Kimi-K3", "ringChange": "Watch → Assess"}, {"name": "对齐推理综述与 Agent 记忆系统研究", "ring": "Assess", "quadrant": "Models & Research", "isNew": true, "description": "多篇关于 LLM Agent 长时程一致性、记忆系统权威综述的论文集中出现，核心结论：记忆系统对 Agent 表现的影响可能超过底座模型差异。", "url": "https://arxiv.org/list/cs.AI/current", "ringChange": null}, {"name": "alibaba/open-code-review", "ring": "Assess", "quadrant": "Frameworks & Infrastructure", "isNew": true, "description": "阿里开源 AI Code Review 工具，Star 19371，近 7 天 61 次 commit，迭代活跃。", "url": "https://github.com/alibaba/open-code-review", "ringChange": null}, {"name": "AI Agent Skills 生态持续升温（Karpathy/Anthropic/Matt Pocock）", "ring": "Assess", "quadrant": "Frameworks & Infrastructure", "isNew": true, "description": "自 5 月起持续发酵的「Skills 取代 MCP」论调本周仍是技术博客热议话题；anthropics/skills（16.7 万 Star）、mattpocock/skills（20.7 万 Star）均维持高位活跃，行业标准化收敛趋势延续但非本周突发新闻。", "url": "https://github.com/anthropics/skills", "ringChange": null}, {"name": "HERA 希腊语 RAG 基准与 Nemotron 适配", "ring": "Watch", "quadrant": "Models & Research", "isNew": true, "description": "首个大规模希腊语检索增强生成基准，NVIDIA Nemotron 检索栈的端到端本地化适配案例。", "url": "https://arxiv.org/abs/2608.05138", "ringChange": null}, {"name": "IJCAI-ECAI 2026 布雷梅", "ring": "Watch", "quadrant": "Practices & Ecosystem", "isNew": true, "description": "第 35 届国际人工智能联合会议，8 月于德国布雷梅召开，属既定日程非突发新闻。", "url": "https://2026.ijcai.org/", "ringChange": null}, {"name": "superpowers", "ring": " const RINGS=["Adopt","Trial","Assess","Watch"];
const QUADS=["Models & Research","Frameworks & Infrastructure","Tools & Products","Practices & Ecosystem"];
const RC={Adopt:"#5ba85a",Trial:"#4a90d9",Assess:"#d9a441",Watch:"#c2544d"};
const CX=380,CY=380,R=[0,96,178,262,342];
// 象限角度（SVG 坐标系 y 向下）：0=右上, 1=左上, 2=左下, 3=右下
// 均按角度递增方向给出，保证线性插值始终落在本象限内
const QA={0:[-Math.PI/2,0],1:[-Math.PI,-Math.PI/2],2:[Math.PI/2,Math.PI],3:[0,Math.PI/2]};
const svg=document.getElementById("radar");
const NS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}

// 环
for(let i=4;i>=1;i--){
  svg.appendChild(el("circle",{cx:CX,cy:CY,r:R[i],fill:i%2?"#141821":"#11151d",stroke:"#252b36","stroke-width":1}));
}
// 十字轴
svg.appendChild(el("line",{x1:CX-R[4],y1:CY,x2:CX+R[4],y2:CY,stroke:"#2b3240","stroke-width":1.2}));
svg.appendChild(el("line",{x1:CX,y1:CY-R[4],x2:CX,y2:CY+R[4],stroke:"#2b3240","stroke-width":1.2}));
// 环标签
RINGS.forEach((r,i)=>{
  const t=el("text",{x:CX+4,y:CY-(R[i]+R[i+1])/2+4,class:"rl"});t.textContent=r;svg.appendChild(t);
});
// 象限标签
const QP=[[CX+R[4]-6,CY-R[4]+6,"end"],[CX-R[4]+6,CY-R[4]+6,"start"],[CX-R[4]+6,CY+R[4]-2,"start"],[CX+R[4]-6,CY+R[4]-2,"end"]];
QUADS.forEach((q,i)=>{
  const t=el("text",{x:QP[i][0],y:QP[i][1],class:"ql","text-anchor":QP[i][2]});t.textContent=q;svg.appendChild(t);
});

// 布局：同象限同环内均匀分布，避免重叠
const buckets={};
DATA.forEach(d=>{const k=QUADS.indexOf(d.quadrant)+"|"+RINGS.indexOf(d.ring);(buckets[k]=buckets[k]||[]).push(d);});
let seq=0; const placed=[];
Object.keys(buckets).forEach(k=>{
  const [qi,ri]=k.split("|").map(Number);
  const arr=buckets[k], [a0,a1]=QA[qi];
  const r0=R[ri]+16, r1=R[ri+1]-14;
  arr.forEach((d,idx)=>{
    const n=arr.length;
    const frac=(idx+0.5)/n;
    const ang=a0+(a1-a0)*(0.08+0.84*frac);
    // 半径用黄金比低差异序列错开，避免相邻角度的点半径相同而碰撞
    const jitter=n===1?0.5:((idx*0.618033988749895)%1);
    const rr=r0+(r1-r0)*(0.14+0.72*jitter);
    d._x=CX+rr*Math.cos(ang); d._y=CY+rr*Math.sin(ang);
    d._n=++seq; placed.push(d);
  });
});

const tip=document.getElementById("tip");
placed.forEach(d=>{
  const g=el("g",{class:"blip"});
  const c=RC[d.ring];
  if(d.isNew){
    const s=9;
    g.appendChild(el("polygon",{points:`${d._x},${d._y-s} ${d._x-s},${d._y+s*0.72} ${d._x+s},${d._y+s*0.72}`,fill:c}));
  }else{
    g.appendChild(el("circle",{cx:d._x,cy:d._y,r:8.6,fill:c}));
  }
  const t=el("text",{x:d._x,y:d._y+(d.isNew?2.6:0),class:"bt"});t.textContent=d._n;g.appendChild(t);
  g.addEventListener("mousemove",e=>{
    tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+14)+"px";
    tip.innerHTML="<b>"+d._n+". "+d.name+"</b><span>"+d.ring+" · "+d.quadrant+(d.ringChange?" · "+d.ringChange:"")+"<br>"+d.description+"</span>";
  });
  g.addEventListener("mouseleave",()=>tip.style.opacity=0);
  g.addEventListener("click",()=>window.open(d.url,"_blank"));
  svg.appendChild(g);
});

// 侧边列表
const side=document.getElementById("side");
QUADS.forEach(q=>{
  const items=placed.filter(d=>d.quadrant===q).sort((a,b)=>RINGS.indexOf(a.ring)-RINGS.indexOf(b.ring)||a._n-b._n);
  if(!items.length)return;
  const g=document.createElement("div");g.className="qgroup";
  g.innerHTML='<div class="qh">'+q+' <span style="color:#6f7a89;font-weight:400">('+items.length+')</span></div>';
  items.forEach(d=>{
    const row=document.createElement("div");row.className="item";
    row.innerHTML='<span class="num" style="background:'+RC[d.ring]+'">'+d._n+'</span>'+
      '<span><a href="'+d.url+'" target="_blank">'+d.name+'</a>'+
      (d.isNew?'<span class="tag">新增</span>':'')+
      (d.ringChange?'<span class="tag">'+d.ringChange+'</span>':'')+
      '<br><span class="desc">'+d.description+'</span></span>';
    g.appendChild(row);
  });
  side.appendChild(g);
});
</script>
